<div class="promo-bar">
  <p>Chỉ duy nhất 1 lần, tặng voucher 100.000 VNĐ cho khách hàng mới của CaraVeso</p>
</div>
<header class="site-header">
  <div class="header-main">
    <nav class="primary-nav" aria-label="Danh mục chính">
      <a routerLink="/products">Sản phẩm <app-icon name="chevron-down" [size]="16" /></a>
      <a routerLink="/rooms">Các phòng <app-icon name="chevron-down" [size]="16" /></a>
      <a routerLink="/inspirations">Nguồn cảm hứng</a>
      <a class="sale-link" routerLink="/promotions">Khuyến mãi</a>
    </nav>
    <a class="brand" routerLink="/" aria-label="CaraVeso - Trang chủ">CaraVeso</a>
    <div class="header-tools">
      <form class="search-box" role="search" (submit)="$event.preventDefault()">
        <app-icon name="search" [size]="24" [strokeWidth]="2" />
        <input type="search" aria-label="Tìm kiếm" placeholder="Nhập sản phẩm, chất liệu, phong cách,..." />
        <button type="button" class="camera-button" aria-label="Tìm bằng hình ảnh"><app-icon name="camera" [size]="22" /></button>
      </form>
      <div class="header-actions">
        <a routerLink="/account/wishlist" aria-label="Danh sách yêu thích"><app-icon name="heart" [size]="26" /></a>
        <a routerLink="/account/profile" [attr.aria-label]="accountProfile()?.name || 'Tài khoản'" [attr.title]="accountProfile()?.name || null"><app-icon name="user" [size]="26" /></a>
        <a routerLink="/cart" aria-label="Giỏ hàng" class="cart-button">
          <app-icon name="cart" [size]="26" />
          @if (cart.itemCount() > 0) { <span>{{ cart.itemCount() }}</span> }
        </a>
      </div>
    </div>
  </div>
</header>
