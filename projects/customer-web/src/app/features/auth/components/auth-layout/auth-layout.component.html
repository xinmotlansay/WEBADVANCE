<div class="auth-layout">
  <nav class="breadcrumb" aria-label="Điều hướng">
    <a routerLink="/">Trang chủ</a>
    @for (crumb of breadcrumbs; track $index) {
      <span class="breadcrumb-separator" aria-hidden="true">›</span>
      @if (crumb.link && !$last) {
        <!-- Giữ returnUrl để quay lại đăng nhập vẫn về đúng trang ban đầu. -->
        <a [routerLink]="crumb.link" queryParamsHandling="preserve">{{ crumb.label }}</a>
      } @else {
        <span [attr.aria-current]="$last ? 'page' : null">{{ crumb.label }}</span>
      }
    }
  </nav>

  <main class="auth-main">
    <ng-content />
  </main>
</div>
